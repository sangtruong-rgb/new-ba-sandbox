/* Direction "Sổ tay" — see taste.md. Users: one person, several times a day, desktop and phone.
   What they look at most: what is overdue and what is due today. */
:root{--bg:#f3eee4;--paper:#fbf8f2;--ink:#1e1a15;--muted:#6a6256;--line:#ddd3c3;--accent:#b93a25;--accent-ink:#fff;--focus:#1e1a15}
@media (prefers-color-scheme:dark){:root{--bg:#191612;--paper:#221e19;--ink:#efe8dc;--muted:#ada393;--line:#3a332a;--accent:#ef7a5c;--accent-ink:#1b120e;--focus:#efe8dc}}
*{box-sizing:border-box}
body{background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 12px;background:#2b2722;color:#f5efe4;font:12px/1.3 'Be Vietnam Pro',sans-serif}
.bar strong{margin-right:6px}
.bar button{background:#47413a;border:0;border-radius:3px;padding:3px 8px;color:#f5efe4;cursor:pointer}
.bar button[aria-current]{background:#f5efe4;color:#2b2722}
[data-screen]{min-height:calc(100vh - 30px)}
.app{min-height:calc(100vh - 30px);background:var(--bg);color:var(--ink);font:15px/1.5 'Be Vietnam Pro',sans-serif;display:grid;grid-template-columns:248px minmax(0,1fr) 360px}
.rail{padding:28px 24px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:28px}
.brand{font:600 22px/1 'Fraunces',serif;letter-spacing:-.01em}
.brand span{color:var(--ink)}
.filters{display:grid;gap:2px}
.filters button{display:flex;justify-content:space-between;align-items:baseline;padding:8px 10px;border-radius:4px;border:0;background:none;text-align:left;cursor:pointer}
.filters button[aria-current]{background:var(--paper);box-shadow:inset 2px 0 0 var(--ink)}
.filters b{font:600 20px/1 'Fraunces',serif;font-variant-numeric:tabular-nums}
.account{margin-top:auto;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
.account strong{display:block;color:var(--ink);font-weight:600;word-break:break-all}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
main{padding:28px 48px 48px;min-width:0}
.date{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:600 44px/1.05 'Fraunces',serif;letter-spacing:-.02em;margin:10px 0 24px;text-wrap:balance}
.add{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-bottom:6px}
.add input,.field{padding:12px 14px;border:1px solid var(--line);background:var(--paper);border-radius:4px;width:100%}
.add input[aria-invalid=true],.field[aria-invalid=true],.duepick input[aria-invalid=true]{border:2px solid var(--ink)}
.duebtn{color:var(--muted);font-size:14px;padding:0 12px;border:1px dashed var(--line);border-radius:4px;background:none;cursor:pointer;white-space:nowrap}
.duebtn.set{color:var(--ink);border-style:solid}
.primary{font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:4px;padding:0 18px;cursor:pointer;min-height:44px}
.duepick{display:flex;gap:8px}
.duepick input{height:100%;min-height:48px;padding:0 12px;border:1px solid var(--line);border-radius:4px;background:var(--paper);font-variant-numeric:tabular-nums}
.duepick .d{width:140px}.duepick .t{width:96px}
.err{color:var(--ink);font-size:13px;font-weight:600;margin:4px 0 0}
.err a{color:inherit}
.adderr{grid-column:1/-1;grid-row:2}
.listwrap{margin-top:22px}
h2{font:600 15px/1 'Fraunces',serif;margin:24px 0 6px;display:flex;gap:10px;align-items:baseline}
h2 small{font:400 13px 'Be Vietnam Pro';color:var(--muted)}
h2.alert{color:var(--accent)}
ul.tasks{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.tasks li{display:grid;grid-template-columns:72px 22px 1fr;gap:12px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line)}
.tasks li[aria-selected=true]{background:var(--paper);margin:0 -12px;padding-left:12px;padding-right:12px}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;padding-top:1px;line-height:1.35}
.time small{display:block;font-size:12px}
.sub{display:none}
.over .time,.over .sub{color:var(--accent)}
.over .time{font-weight:600}
.box{width:20px;height:20px;border:1.5px solid var(--ink);border-radius:3px;margin-top:2px;display:grid;place-items:center;background:none;padding:0;cursor:pointer;color:var(--accent-ink)}
.box svg{width:14px}
.done .box{background:var(--muted);border-color:var(--muted)}
.rowbtn{background:none;border:0;padding:0;text-align:left;cursor:pointer;width:100%}
.done .title{color:var(--muted);text-decoration:line-through}
.tasks .sub{color:var(--muted);font-size:13px}
.tasks .over .sub{color:var(--accent);font-weight:600}
.empty{padding:28px 0;color:var(--muted);border-top:1px solid var(--line)}
aside{border-left:1px solid var(--line);background:var(--paper);padding:28px}
aside .k{font-size:13px;font-weight:600;color:var(--muted);margin:20px 0 6px}
.titlefield{width:100%;resize:none;field-sizing:content;min-height:0;font:600 22px/1.25 'Fraunces',serif;border:0;border-bottom:1px solid var(--line);background:none;padding:6px 0;border-radius:0}
.titlefield:focus{border-bottom:2px solid var(--ink);outline:none}
.titlefield[aria-invalid=true]{border-bottom:2px solid var(--ink)}
aside h3{font:600 26px/1.2 'Fraunces',serif;margin:6px 0 0;word-break:break-word}
aside .none{color:var(--muted);margin-top:40px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.clear{margin-top:8px;font-size:14px}
.actions{display:flex;gap:16px;margin-top:28px;font-size:14px;border-top:1px solid var(--line);padding-top:16px}
.actions .del{color:var(--muted)}
.back{display:none}
.top390{display:none}
/* sign in */
.gate{min-height:calc(100vh - 30px);display:grid;grid-template-columns:minmax(0,1fr) 520px;background:var(--bg);color:var(--ink);font:15px/1.5 'Be Vietnam Pro',sans-serif}
.gate .left{padding:56px 64px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between}
.gate .left p{font:600 52px/1.05 'Fraunces',serif;letter-spacing:-.02em;max-width:13ch;margin:0;text-wrap:balance}
.gate .left small{color:var(--muted)}
.gate form{padding:56px 56px;background:var(--paper);display:flex;flex-direction:column;gap:6px;justify-content:center}
.gate h1{font-size:32px;margin:0 0 18px}
.gate label{font-size:13px;color:var(--muted);margin-top:10px}
.gate .primary{margin-top:20px;min-height:48px}
.gate .switch{margin-top:16px;font-size:14px;color:var(--muted)}
.gate a{color:var(--ink);text-underline-offset:3px}
.notice{margin:-8px 0 12px;font-size:13px;font-weight:600}
@media (max-width:600px){
 .app{grid-template-columns:1fr}
 .rail{display:none}
 .top390{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;margin:-20px -16px 16px;border-bottom:1px solid var(--line)}
 .top390 .account{margin:0;border:0;padding:0;text-align:right}
 .top390 .account strong{display:none}
 main{padding:20px 16px}
 h1{font-size:26px;margin-bottom:16px}
 .chips{display:flex;gap:6px;margin:0 0 16px;overflow-x:auto}
 .chips button{flex:none;font-size:14px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:none;cursor:pointer;min-height:36px}
 .chips button[aria-current]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
 .add{grid-template-columns:1fr auto}
 .add .duebtn,.add .duepick{grid-column:1/-1;grid-row:3;justify-self:start;min-height:40px}
 .gate{grid-template-columns:1fr}
 .gate .left{padding:28px 16px 8px;border:0}
 .gate .left p{display:none}
 .gate .left small{display:none}
 .gate form{padding:24px 16px;background:none}
}
@media (min-width:601px){.chips{display:none}}
@media (max-width:1099px){.app{grid-template-columns:248px minmax(0,1fr)}aside{display:none}.app.sel main{display:none}.app.sel aside{display:block;border-left:0;padding:24px 32px}.app.sel .back{display:inline-block;margin-bottom:16px;font-weight:600;text-decoration:none}.tasks .sub{display:block}.tasks li{grid-template-columns:22px 1fr}.tasks .time{display:none}}
@media (max-width:600px){.app{grid-template-columns:1fr}.app.sel aside{padding:16px}}

function short(t){const a=day0(new Date(t)),n=Math.round((a-day0(NOW))/864e5);if(n===-1)return'Hôm qua';if(n===0)return'Hôm nay';if(n===1)return'Ngày mai';return DOW_S[a.getDay()]+' '+pad(a.getDate())+'/'+pad(a.getMonth()+1)+(a.getFullYear()!==NOW.getFullYear()?'/'+a.getFullYear():'');}

const over=t=>!t.done&&t.dueAt&&new Date(t.dueAt)<NOW;
function groups(list){
 const g={over:[],today:[],soon:[],none:[],done:[]};const end=new Date(day0(NOW).getTime()+864e5);
 for(const t of list){if(t.done)g.done.push(t);else if(!t.dueAt)g.none.push(t);else if(new Date(t.dueAt)<NOW)g.over.push(t);else if(new Date(t.dueAt)<end)g.today.push(t);else g.soon.push(t);}
 const byDue=(a,b)=>new Date(a.dueAt)-new Date(b.dueAt);g.over.sort(byDue);g.today.sort(byDue);g.soon.sort(byDue);
 g.none.sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));g.done.sort((a,b)=>new Date(b.doneAt)-new Date(a.doneAt));

function listHtml(){

function detailHtml(){const t=st.tasks.find(x=>x.id===st.sel);

 <div class="k">Hạn chót</div><div class="row2"><input class="field" aria-label="Ngày hạn chót" placeholder="dd/mm/yyyy" value="${due?pad(due.getDate())+'/'+pad(due.getMonth()+1)+'/'+due.getFullYear():''}" data-in="editDate"><input class="field" aria-label="Giờ hạn chót" placeholder="hh:mm" value="${due?hm(t.dueAt):''}" data-in="editTime"></div>

function gateHtml(){const up=st.page==='up';
 return `<div class="gate" data-slot="gate"><div class="left"><div class="brand">Việc<span>.</span></div><p>Mọi việc cần làm, ở một chỗ, trên mọi máy.</p><small>Dữ liệu của bạn gắn với tài khoản, chỉ bạn thấy.</small></div>
 <form data-act-submit="${up?'signup':'signin'}"><h1>${up?'Tạo tài khoản':'Đăng nhập'}</h1>${st.notice&&!up?`<p class="notice" role="status">${st.notice}</p>`:''}

 <label for="g-pass">Mật khẩu</label><input id="g-pass" class="field" type="password" placeholder="${up?'Ít nhất 8 ký tự':''}" ${st.gateErr&&(!up||st.gateErr==='Mật khẩu cần ít nhất 8 ký tự')?'aria-invalid="true"':''}>

function render(){

function dueCheck(dd,tt){if(!dd&&!tt)return{};if(!dd)return{err:'Chọn ngày cho hạn chót'};const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(dd),t=tt?/^(\d{1,2}):(\d{2})$/.exec(tt):[0,'23','59'];if(!m||!t||+t[1]>23||+t[2]>59)return{err:'Ngày giờ không hợp lệ'};const x=new Date(+m[3],m[2]-1,+m[1]);if(x.getDate()!=+m[1]||x.getMonth()!=m[2]-1)return{err:'Ngày giờ không hợp lệ'};return{};}
function parseDue(dd,tt){const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(dd||'');if(!m)return null;const t=/^(\d{1,2}):(\d{2})$/.exec(tt||'')||[0,23,59];return new Date(+m[3],m[2]-1,+m[1],+t[1],+t[2]).toISOString();}
document.addEventListener('input',e=>{const k=e.target.dataset.in;if(!k)return;st[k]=e.target.value;});

 if(c.err){st.editErr=c.err;}else{t.dueAt=box[0].value?parseDue(box[0].value,box[1].value):null;st.editErr='';}render();});

function rename(){const t=st.tasks.find(x=>x.id===st.sel);if(!t||st.editTitle===null)return;const v=st.editTitle.trim();
 if(!v){st.editErr='Nhập tên việc';}else if(v.length>200){st.editErr='Tên việc tối đa 200 ký tự';}else{t.title=v;st.editTitle=null;st.editErr='';}render();}

 if(a==='signin'||a==='signup'){const em=e.target.querySelector('#g-email').value,pw=e.target.querySelector('#g-pass').value;
  if(a==='signup'&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){st.gateErr='Email không hợp lệ';render();return;}
  if(a==='signup'&&pw.length<8){st.gateErr='Mật khẩu cần ít nhất 8 ký tự';render();return;}
  if(a==='signin'&&(!em||!pw)){st.gateErr='Email hoặc mật khẩu không đúng';render();return;}
  st.signedIn=true;st.email=em;st.gateErr='';st.notice='';if(a==='signup')st.tasks=[];render();}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act],[data-go]');if(!b)return;

  case'filter':st.filter=b.dataset.k;break;
